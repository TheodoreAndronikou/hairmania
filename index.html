<script>
document.addEventListener('DOMContentLoaded', function () {
  var b = CONFIG.business;
  document.getElementById('addr-line').textContent = b.address.street + ', ' + b.address.city + ' ' + b.address.postcode;
  document.getElementById('dir-btn').href = HMV.mapsLink();

  /* εικονίδια */
  document.querySelectorAll('[data-ico]').forEach(function (el) {
    var n = el.getAttribute('data-ico');
    if (n.slice(-6) === '-after') el.insertAdjacentHTML('beforeend', HMV.icon(n.slice(0, -6)));
    else el.insertAdjacentHTML('afterbegin', HMV.icon(n));
  });
  document.querySelectorAll('[data-ico-block]').forEach(function (el) {
    el.innerHTML = HMV.icon(el.getAttribute('data-ico-block'), 'card__ico');
  });
});
</script>
