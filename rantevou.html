<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Κλείσε ραντεβού — HAIR MANIA VALKANIS</title>
<meta name="description" content="Κλείσε online ραντεβού στο HAIR MANIA VALKANIS στα Γιαννιτσά. Δες τις πραγματικά ελεύθερες ώρες και κλείσε σε λιγότερο από ένα λεπτό.">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="index,follow">
<link rel="icon" href="assets/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="book">
<a class="skip" href="#main" data-i18n="nav.skip"></a>
<header class="hdr" data-header></header>

<main id="main" class="section">
  <div class="wrap" style="max-width:820px">

    <p class="eyebrow" data-i18n="bk.eyebrow"></p>
    <h1 data-i18n="bk.h2"></h1>
    <p class="lead" data-i18n="bk.sub"></p>

    <div id="bk-wizard">
      <div class="steps" aria-hidden="true">
        <div class="step" data-state="active"><span data-i18n="bk.step1"></span></div>
        <div class="step"><span data-i18n="bk.step2"></span></div>
        <div class="step"><span data-i18n="bk.step3"></span></div>
        <div class="step"><span data-i18n="bk.step4"></span></div>
      </div>

      <form id="bk" novalidate>

        <fieldset id="fs-1">
          <legend><span class="n">1</span><span data-i18n="bk.l1"></span></legend>
          <div class="opts" id="bk-services"></div>
        </fieldset>

        <fieldset id="fs-2">
          <legend><span class="n">2</span><span data-i18n="bk.l2"></span></legend>
          <div id="bk-days"></div>
        </fieldset>

        <!-- Όχι στην κορυφή: εκεί το έβλεπε κάποιος πριν καν κοιτάξει
             ημερομηνία και έφευγε νομίζοντας ότι το μαγαζί είναι κλειστό. -->
        <div class="vac" id="bk-vac" data-show="false">
          <img src="assets/img/vacation.jpg" alt="">
          <div>
            <h3 data-i18n="vac.title"></h3>
            <p id="bk-vac-text"></p>
            <p class="muted" style="font-size:.86rem;margin-top:4px" data-i18n="vac.body"></p>
          </div>
        </div>

        <fieldset id="fs-3">
          <legend><span class="n">3</span><span data-i18n="bk.l3"></span></legend>
          <div id="bk-slots" aria-live="polite"></div>
          <p class="hint" id="bk-slots-msg" hidden></p>
        </fieldset>

        <fieldset id="fs-4">
          <legend><span class="n">4</span><span data-i18n="bk.l4"></span></legend>

          <div class="field-row">
            <div class="field">
              <label for="f-name"><span data-i18n="bk.name"></span> <span class="req">*</span></label>
              <input id="f-name" name="name" type="text" autocomplete="name" required
                     data-i18n-attr="placeholder:bk.name_ph">
              <p class="field__err" data-i18n="bk.err_name"></p>
            </div>
            <div class="field">
              <label for="f-phone"><span data-i18n="bk.phone"></span> <span class="req">*</span></label>
              <input id="f-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" required
                     data-i18n-attr="placeholder:bk.phone_ph">
              <p class="field__err" data-i18n="bk.err_phone"></p>
            </div>
          </div>

          <div class="field">
            <label for="f-email" data-i18n="bk.email"></label>
            <input id="f-email" name="email" type="email" autocomplete="email"
                   data-i18n-attr="placeholder:bk.email_ph">
            <p class="field__err" data-i18n="bk.err_email"></p>
          </div>

          <div class="field">
            <label for="f-notes" data-i18n="bk.notes"></label>
            <input id="f-notes" name="notes" type="text" maxlength="140"
                   data-i18n-attr="placeholder:bk.notes_ph">
          </div>
        </fieldset>

        <div class="summary" id="bk-summary"></div>

        <p class="hint hint--err" id="bk-error" hidden></p>

        <p style="margin-top:20px">
          <button type="submit" class="btn btn--accent btn--wide" id="bk-submit" disabled data-i18n="bk.submit"></button>
        </p>
        <p class="muted center" style="font-size:.8rem" data-i18n="bk.privacy"></p>
      </form>
    </div>

    <div id="bk-done" hidden></div>

  </div>
</main>

<footer class="ftr" data-footer></footer>
<nav class="bar" data-bar aria-label="Quick actions"></nav>

<!-- Τελευταίος έλεγχος πριν κλείσει η ώρα. Δεν είναι γραφειοκρατία:
     εδώ πιάνεται το λάθος ψηφίο στο τηλέφωνο και η λάθος μέρα. -->
<div class="sheet" id="bk-sheet" hidden>
  <div class="sheet__box" role="dialog" aria-modal="true" aria-labelledby="bk-sheet-title">
    <div class="sheet__hd"><b id="bk-sheet-title"></b>
      <button class="cal__nav" id="bk-sheet-x" type="button" aria-label="Κλείσιμο"></button></div>
    <div class="sheet__bd" id="bk-sheet-body"></div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/app.js" defer></script>
<script src="assets/js/ics.js" defer></script>
<script src="assets/js/booking.js" defer></script>
</body>
</html>
