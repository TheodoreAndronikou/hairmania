<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Διαχείριση — HAIR MANIA VALKANIS</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14140F">
<link rel="icon" href="assets/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="admin">

<main id="main" class="section" style="padding-block:0">
  <div class="wrap" style="max-width:560px;padding-top:18px">

    <!-- ΚΛΕΙΔΩΜΑ -->
    <div id="gate">
      <div style="text-align:center;margin:40px 0 26px">
        <img src="assets/img/logo.jpg" alt="" width="120" style="margin:0 auto 18px;border:2px solid var(--line)">
        <h1 style="font-size:clamp(2rem,8vw,2.8rem);margin:0">ΔΙΑΧΕΙΡΙΣΗ</h1>
        <p class="muted" style="font-size:.86rem">Μόνο για το κατάστημα</p>
      </div>
      <div class="field">
        <label for="pw">Κωδικός</label>
        <!-- ΧΩΡΙΣ inputmode="numeric": έβγαζε αριθμητικό πληκτρολόγιο στο
             κινητό, οπότε ο κωδικός με γράμματα ήταν αδύνατο να γραφτεί. -->
        <div class="field__pw">
          <input id="pw" type="password" autocomplete="current-password"
                 autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Ο κωδικός σου">
          <button type="button" id="pw-eye" class="field__eye" aria-label="Δείξε τον κωδικό">ΔΕΙΞΕ</button>
        </div>
        <p class="field__err" id="pw-err" style="display:none">Λάθος κωδικός</p>
      </div>
      <button class="btn btn--accent btn--wide" id="gate-go">ΕΙΣΟΔΟΣ</button>
    </div>

    <!-- ΠΙΝΑΚΑΣ -->
    <div id="panel" hidden>
      <div class="adm__warn" id="adm-warn" hidden>
        <b>Ο κωδικός είναι ακόμα ο εργοστασιακός (1234).</b>
        <span>Όποιος βρει τη διεύθυνση βλέπει ονόματα και τηλέφωνα πελατών.</span>
        <button class="btn btn--wide" id="adm-warn-go">ΑΛΛΑΞΕ ΤΟΝ ΤΩΡΑ</button>
      </div>

      <div class="adm__tabs" role="tablist">
        <button class="adm__tab" id="tab-day" role="tab" aria-selected="true">ΜΕΡΑ</button>
        <button class="adm__tab" id="tab-week" role="tab" aria-selected="false">ΕΒΔΟΜΑΔΑ</button>
        <button class="adm__today" id="adm-today">ΣΗΜΕΡΑ</button>
      </div>

      <div class="adm__top">
        <div class="adm__pick">
          <!-- Το διάφανο input κάθεται ΠΑΝΩ στο κείμενο της ημερομηνίας:
               στο κινητό το πάτημα φτάνει στο ίδιο το πεδίο, που είναι ο
               μόνος τρόπος να ανοίξει ο επιλογέας του iOS. -->
          <div class="adm__dateWrap">
            <span class="adm__date" id="adm-date"></span>
            <input type="date" id="adm-jump" aria-label="Διάλεξε ημερομηνία">
          </div>
          <div class="adm__sub" id="adm-sub"></div>
        </div>
        <button class="cal__nav" id="adm-prev" aria-label="Προηγούμενο"></button>
        <button class="cal__nav" id="adm-next" aria-label="Επόμενο"></button>
      </div>

      <div id="adm-list"></div>
      <div id="adm-week" hidden></div>

      <div class="adm__actions">
        <button class="btn btn--primary btn--wide" id="adm-walkin">+ ΝΕΟ ΡΑΝΤΕΒΟΥ</button>
        <button class="btn btn--block btn--wide" id="adm-block">ΜΠΛΟΚΑΡΕ ΩΡΕΣ</button>
        <button class="btn btn--off btn--wide" id="adm-closeday">ΔΙΑΚΟΠΕΣ / ΡΕΠΟ</button>
      </div>

      <p class="muted" style="font-size:.72rem;margin-top:22px;text-align:center">
        Συνδεδεμένο με το βιβλίο ραντεβού του καταστήματος.<br>
        Ό,τι γράφεις εδώ το βλέπουν όλοι, αμέσως.
      </p>
      <p style="text-align:center;margin-top:10px;display:flex;gap:8px;justify-content:center">
        <button class="btn btn--ghost" id="adm-pin" style="padding:8px 16px;font-size:.7rem">ΑΛΛΑΞΕ ΚΩΔΙΚΟ</button>
        <button class="btn btn--ghost" id="adm-out" style="padding:8px 16px;font-size:.7rem">ΕΞΟΔΟΣ</button>
      </p>
    </div>

  </div>
</main>

<!-- φύλλο ενεργειών -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__box">
    <div class="sheet__hd"><b id="sheet-title"></b>
      <button class="cal__nav" id="sheet-x" aria-label="Κλείσιμο"></button></div>
    <div class="sheet__bd" id="sheet-body"></div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/app.js" defer></script>
<script src="assets/js/admin.js" defer></script>
</body>
</html>
